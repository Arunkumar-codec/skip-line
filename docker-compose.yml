version: "3.9"

services:
  # ── MySQL database ──────────────────────────────────────────────────────────
  # 8.0.46 is the EXACT engine version the migration chain, FK audit (14/14)
  # and index audit (9/9) were verified against (hosted CI runs
  # 42261999029/42263779003 and the local sync/async rehearsals). The previous
  # 8.3 tag is an Innovation line already past its support window — 8.0.46
  # aligns deployment with the verified evidence.
  db:
    image: mysql:8.0.46
    container_name: skipline_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - export it or add it to .env (see .env.example)}
      MYSQL_DATABASE: ${DB_NAME:-skipline}
      MYSQL_USER: ${DB_USER:-skipline_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - export it or add it to .env (see .env.example)}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - export it or add it to .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - skipline_net

  # ── FastAPI application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: skipline_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # Phase 6: multi-worker WebSocket pub/sub fan-out (empty = single-worker)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Phase 8 (SEC-003): local ClamAV scan pipeline — enabled only when the
      # operator opts in via .env; with CLAMAV_ENABLED=false uploads record
      # scan_status="disabled" (never "clean").
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Phase 8 (SEC-004): CSRF double-submit enforcement is automatic in
      # production (app_env="production"); force it elsewhere if needed.
      CSRF_ENFORCE: ${CSRF_ENFORCE:-false}
      # Debug pages / SQL echo are a production configuration error
      # (config validator); default off for compose deployments.
      APP_DEBUG: ${APP_DEBUG:-false}
      # Structured file logging: writes request/audit logs into the app_logs
      # volume (previously the volume existed but no sink wrote to it).
      LOG_DIR: /app/logs
      LOG_FILE_LEVEL: ${LOG_FILE_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - qr_codes:/app/qr_codes
      - receipts:/app/receipts
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - skipline_net

  # ── Redis (Phase 6/8): pub/sub fan-out + distributed rate-limit store ──────
  redis:
    image: redis:7-alpine
    container_name: skipline_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skipline_net

  # ── ClamAV (Phase 8 — SEC-003): local malware-scanning daemon ──────────────
  clamav:
    image: clamav/clamav:1.4
    container_name: skipline_clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      # clamdcheck.sh ships with the clamav/clamav image and verifies that
      # clamd is accepting connections (PONG).
      test: ["CMD", "/usr/local/bin/clamdcheck.sh", "30s"]
      interval: 30s
      timeout: 35s
      retries: 5
      # first start downloads the full signature database — allow for it
      start_period: 10m
    networks:
      - skipline_net

  # ── Backup (one-shot; `docker compose run --rm backup` or make backup) ─────
  # Runs scripts/backup.sh inside the SAME mysql:8.0.46 engine as the db
  # service (mysqldump included). Backups land in ./backups (gitignored).
  # Not started by `compose up`.
  backup:
    image: mysql:8.0.46
    profiles: ["backup"]
    container_name: skipline_backup
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-skipline}
      DB_USER: ${DB_USER:-skipline_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - export it or add it to .env (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/scripts/backup.sh"]
    networks:
      - skipline_net

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: skipline_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_CONF selects the config: nginx.conf (dev/HTTP) or
      # nginx.production.conf (HTTPS, see .env.example)
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      # TLS certificate/key material — NEVER committed (nginx/ssl/.gitignore)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # ACME webroot: certbot (on the host) drops challenge files here,
      # nginx.production.conf serves them over HTTP :80 (see docs/deployment.md)
      - ./nginx/webroot:/var/www/certbot:ro
      - qr_codes:/app/qr_codes:ro
      - receipts:/app/receipts:ro
    depends_on:
      - app
    networks:
      - skipline_net

volumes:
  mysql_data:
  redis_data:
  clamav_data:
  qr_codes:
  receipts:
  app_logs:

networks:
  skipline_net:
    driver: bridge
