version: "3.9"

services:
  # ── MySQL database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.3
    container_name: skipline_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - export it or add it to .env (see .env.example)}
      MYSQL_DATABASE: ${DB_NAME:-skipline}
      MYSQL_USER: ${DB_USER:-skipline_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - export it or add it to .env (see .env.example)}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - export it or add it to .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - skipline_net

  # ── FastAPI application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: skipline_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8000:8000"
    volumes:
      - qr_codes:/app/qr_codes
      - receipts:/app/receipts
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - skipline_net

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: skipline_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - qr_codes:/app/qr_codes:ro
      - receipts:/app/receipts:ro
    depends_on:
      - app
    networks:
      - skipline_net

volumes:
  mysql_data:
  qr_codes:
  receipts:
  app_logs:

networks:
  skipline_net:
    driver: bridge
