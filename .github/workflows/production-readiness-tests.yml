# SkipLine — Production-Readiness CI (Phase 9 verification, NOT Phase 10).
#
# Executes the complete automated test suite (857 collected tests) plus the
# real MySQL migration chain. Design rules (see docs/CI_VERIFICATION_GUIDE.md):
#   - NO production credentials, no real database, no payments, no paid LLM
#     calls: every value here is synthetic and test-only. This workflow uses
#     no GitHub secrets at all, so it is safe for fork pull requests.
#   - Disposable MySQL 8.0.46 + isolated Redis only; the migration job
#     aborts unless the target DB is EXACTLY skipline_ci_migrate
#     (exact allowlist; refuses to touch any pre-existing database).
#   - Test-suite DB stays the in-memory SQLite that tests/conftest.py uses;
#     the DB_* env vars merely redirect the (never-connected) app engine
#     away from any real database.
#   - Minimal GitHub token permissions (contents: read).

name: production-readiness-tests

"on":
  # Activation is manual by design: push/PR events fire only AFTER an
  # authorized user enables Actions on the repository (repo Settings tab).
  # The key is quoted so every YAML 1.1 parser (which maps bare `on` to a
  # boolean) reads the event block exactly as GitHub Actions does.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: prodcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ── Job 1: complete pytest suite (disposable MySQL + Redis services) ────────
  pytest-suite:
    name: pytest full suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        # Exact version verified against during local prodcheck (8.0.46).
        # Synthetic credentials only; this instance exists for this job run.
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ci-only-synthetic-password
          MYSQL_DATABASE: skipline_ci
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-synthetic-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        # Required by tests/integration/test_redis_real.py, which self-skips
        # when unreachable — in CI it will actually run (default URL matches
        # 127.0.0.1:6379/15). Isolated, disposable, never shared.
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_NAME: "skipline_ci"
      DB_USER: "root"
      DB_PASSWORD: ci-only-synthetic-password
      REDIS_TEST_URL: "redis://127.0.0.1:6379/15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 (matches the verified local environment)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Environment gate (greenlet + async drivers must import)
        run: |
          python -c "import greenlet; print('greenlet', greenlet.__version__)"
          python -c "import aiosqlite, aiomysql, pytest; print('drivers OK')"

      - name: Run the full pytest suite
        # NOTE: normal fixtures in use — --noconftest is intentionally NOT set.
        # The in-memory SQLite session fixture (tests/conftest.py) prepares the
        # DB; no test connects to the MySQL service engine directly.
        # `set -o pipefail` propagates pytest's exit code THROUGH the `tee`
        # pipeline — without it the trailing tee would zero out a failed
        # run and the job could never go red. stderr is merged (2>&1) so
        # pytest's failure output is captured. On failure the tail of the
        # output is emitted as ::error:: annotations so the public
        # check-runs API exposes the actual failure.
        run: |
          set -o pipefail
          code=0
          python -m pytest --tb=short --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt || code=$?
          if [ "$code" -ne 0 ]; then
            tail -n 6 pytest-output.txt | while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error::$enc"
            done
            grep -E "(Error|error)" pytest-output.txt | tail -n 2 | while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error::$enc"
            done
            exit "$code"
          fi
          # SUCCESS PATH: emit the final tally as ::notice:: annotations so
          # the public check-runs API records the exact passed/failed/
          # skipped counts even without repository-log access.
          grep -E "[0-9]+ (passed|failed|error|skipped|xfailed|xpassed)" pytest-output.txt | tail -n 5 | while IFS= read -r line; do
            enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' -e 's/^=+//')
            echo "::notice::$enc"
          done

      - name: Suite counts summary
        if: always()
        run: |
          {
            echo "## SkipLine pytest results"
            echo '```'
            grep -E "[0-9]+ (passed|failed|error|skipped|warning)" pytest-output.txt | tail -n 3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "[0-9]+ (passed|failed|error)" pytest-output.txt || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            pytest-output.txt
          if-no-files-found: warn

  # ── Job 2: real MySQL migration chain ──────────────────────────────────────
  # Locally this chain was verified through a temporary sync env.py (the
  # workstation's Code Integrity policy blocks greenlet). In CI the repo's
  # normal async env.py runs as-is, proving it a second way.
  mysql-migration-chain:
    name: MySQL migration chain 0001→0018 up/down/re-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ci-only-synthetic-password
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-synthetic-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_NAME: "skipline_ci_migrate"
      DB_USER: "root"
      DB_PASSWORD: ci-only-synthetic-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migration chain up / down / re-up + FK & index audit
        # The script self-gates: it aborts unless DB_NAME is EXACTLY
        # skipline_ci_migrate (loopback host, valid port, synthetic
        # credentials), refuses to run when that database already exists,
        # and only ever drops a database created by its own current run.
        # Full output (stdout+stderr) is captured and, on failure, emitted
        # as ::error:: annotations so the public check-runs API exposes
        # the actual failure.
        run: |
          code=0
          python scripts/ci_migration_chain_check.py 2>&1 | tee ci-migration-output.txt || code=$?
          if [ "$code" -ne 0 ]; then
            tail -n 6 ci-migration-output.txt | while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error::$enc"
            done
            grep -E "(Error|error)" ci-migration-output.txt | tail -n 2 | while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error::$enc"
            done
            exit "$code"
          fi
          # SUCCESS PATH: record the ALL-OK audit verdict on the public
          # check-runs API (logs are inaccessible without admin auth).
          grep -E "ALL-OK" ci-migration-output.txt | tail -n 1 | while IFS= read -r line; do
            enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::notice::$enc"
          done

      - name: Upload migration output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-output
          path: ci-migration-output.txt
          if-no-files-found: warn
