<!-- templates/shared/org_sidebar.html -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-skip-forward-fill"></i></div>
    <div class="brand-text">
      <span class="brand-name">Skip Line</span>
      <span class="brand-role text-truncate" style="max-width:130px" title="{{ current_org.name if current_org else '' }}">
        {{ current_org.name if current_org else 'Organization' }}
      </span>
    </div>
  </div>

  <nav class="sidebar-nav mt-3">
    <div class="nav-section-label">Main</div>
    <a href="/org/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i><span>Dashboard</span>
    </a>

    <div class="nav-section-label">Queue</div>
    <a href="/org/queue" class="nav-item {% if active_page == 'queue' %}active{% endif %}">
      <i class="bi bi-list-ol"></i><span>Queue Management</span>
    </a>
    <a href="/org/display" class="nav-item {% if active_page == 'display' %}active{% endif %}">
      <i class="bi bi-display"></i><span>Display Screen</span>
    </a>

    <div class="nav-section-label">Setup</div>
    <a href="/org/counters" class="nav-item {% if active_page == 'counters' %}active{% endif %}">
      <i class="bi bi-hdd-rack"></i><span>Counters</span>
    </a>
    <a href="/org/services" class="nav-item {% if active_page == 'services' %}active{% endif %}">
      <i class="bi bi-card-checklist"></i><span>Services</span>
    </a>

    <div class="nav-section-label">Reports</div>
    <a href="/org/reports" class="nav-item {% if active_page == 'reports' %}active{% endif %}">
      <i class="bi bi-bar-chart"></i><span>Reports</span>
    </a>
    <a href="/org/payments" class="nav-item {% if active_page == 'payments' %}active{% endif %}">
      <i class="bi bi-currency-rupee"></i><span>Payments</span>
    </a>

    <div class="nav-section-label">Account</div>
    <a href="/org/profile" class="nav-item {% if active_page == 'profile' %}active{% endif %}">
      <i class="bi bi-building-gear"></i><span>Profile</span>
    </a>
    <a href="/org/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
      <i class="bi bi-gear"></i><span>Settings</span>
    </a>
    <a href="/org/logout" class="nav-item text-danger">
      <i class="bi bi-box-arrow-right"></i><span>Logout</span>
    </a>
  </nav>
</aside>
<div class="sidebar-overlay d-lg-none" id="sidebarOverlay"></div>
