worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"'
                    ' cs=$ssl_client_verify';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Upstream FastAPI
    upstream skipline_app {
        server app:8000;
        keepalive 32;
    }

    # ── HTTP: ACME challenges + redirect everything else to HTTPS ────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # certbot webroot renewal (no redirect for the challenge path)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Everything else MUST use TLS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: the real entry point ─────────────────────────────────────────
    # Certificates are mounted from ./nginx/ssl (IGNORED by Git — see
    # nginx/ssl/.gitignore). No key material is ever committed.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 10M;

        # HSTS — only meaningful on this TLS listener. Security headers
        # (CSP, X-Frame-Options, nosniff, …) are owned by the FastAPI
        # middleware and pass through unchanged; nginx deliberately does
        # NOT duplicate them (duplicate headers would conflict).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # WebSocket upgrade support
        location /ws/ {
            proxy_pass http://skipline_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Auth endpoints — strict rate limit
        location ~ ^/(auth|admin/login|org/login|user/login) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://skipline_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # API — standard rate limit
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://skipline_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Everything else
        location / {
            proxy_pass http://skipline_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
